<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nostra - Collections</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <h1>NOSTRA</h1>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="collections.html">Collections</a>
            <a href="contact.html">Contact Us</a>
            <a href="login.html">Login</a>
        </div>
    </nav>

    <div class="main-content-wrapper"> 
        <div class="collections-main">
            <h2>All Products</h2>

            <div class="search-filter-section">
                <input type="text" id="searchInput" placeholder="Search products..." onkeyup="searchProducts()">
                
                <select id="filterSelect" onchange="filterProducts()">
                    <option value="all">All Categories</option>
                    <option value="men">Men's Wear</option>
                    <option value="women">Women's Wear</option>
                    <option value="accessories">Accessories</option>
                </select>
            </div>

            <div class="product-grid" id="productGrid">
                <div class="product-card" data-category="women" data-name="Women's Dress">
                    <img src="Image/col 1.png" alt="Women's Dress">
                    <h3>Women's Dress</h3>
                    <p class="price">$85.00</p>
                    <button>View Details</button>
                </div>
                
                <div class="product-card" data-category="men" data-name="Men's Shirt">
                    <img src="Image/col 2.png" alt="Men's Shirt">
                    <h3>Men's Shirt</h3>
                    <p class="price">$45.00</p>
                    <button>View Details</button>
                </div>
                <div class="product-card" data-category="men" data-name="Slim Fit Jeans">
                    <img src="Image/col 3.png" alt="Slim Fit Jeans">
                    <h3>Slim Fit Jeans</h3>
                    <p class="price">$70.00</p>
                    <button>View Details</button>
                </div>
                <div class="product-card" data-category="accessories" data-name="Leather Watch">
                    <img src="Image/col 4.png" alt="Leather Watch">
                    <h3>Leather Watch</h3>
                    <p class="price">$120.00</p>
                    <button>View Details</button>
                </div>
                </div>
        </div>
    </div>
    <footer>
        <p>&copy; Nostra E-commerce. </p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
