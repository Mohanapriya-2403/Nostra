<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nostra - Home</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <h1>NOSTRA</h1>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="collections.html">Collections</a>
            <a href="contact.html">Contact Us</a>
            <a href="login.html">Login</a>
        </div>
        <i class="fa-solid fa-bars" id="menuicon"></i>
    </nav>

    <div class="main-content-wrapper"> 
        <header class="hero-section">
            <div class="hero-content">
                <h2>New Arrivals</h2>
                <p>Shop the latest trends in fashion and style.</p>
                <button onclick="location.href='collections.html'">Shop Now</button>
            </div>
            
        </header>

        <section class="featured-products">
            <h2>Featured Collection</h2>
            <div class="product-container">
                <div class="product-card">
                    <img src="Image/home 1.jpg" alt="Product 1">
                    <h3>Product Name 1</h3>
                    <p>$50.00</p>
                    <button>Add to Cart</button>
                </div>
                <div class="product-card">
                    <img src="Image/home 2.png" alt="Product 2">
                    <h3>Product Name 2</h3>
                    <p>$75.00</p>
                    <button>Add to Cart</button>
                </div>
                </div>
        </section>
    </div>
    <footer>
        <p>&copy; Nostra E-commerce. </p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
